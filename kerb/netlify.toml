# Kerb Automation site. Static only, no build step.
# Netlify: set "Base directory" to kerb (or drag this folder into Netlify Drop).
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The personalised pitch page shouldn't appear in search.
[[headers]]
  for = "/pitch.html"
  [headers.values]
    X-Robots-Tag = "noindex"
